<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gridflow – Logikrätsel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0A0F1E; --surface: #131929; --ink: #F0F4FF;
      --ink2: #A8B3CC; --ink3: #5A6680; --line: #1E2A40;
      --accent: #49A2FE;
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'Hanken Grotesk', -apple-system, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.75; -webkit-font-smoothing: antialiased; min-height: 100vh; display: flex; flex-direction: column; }
    .g-nav { display: flex; align-items: center; padding: 16px 24px; max-width: 900px; margin: 0 auto; width: 100%; }
    .g-nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; font-size: 18px; font-weight: 600; color: var(--ink); }
    .g-nav-icon { width: 32px; height: 32px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
    .hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 60px 24px; }
    .hero h1 { font-family: 'Instrument Serif', Georgia, serif; font-size: clamp(36px, 8vw, 64px); font-weight: 400; line-height: 1.15; margin-bottom: 16px; }
    .hero h1 span { color: var(--accent); }
    .hero p { font-size: 18px; color: var(--ink2); max-width: 480px; margin-bottom: 36px; }
    .badge { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 18px; color: var(--ink2); font-size: 14px; text-decoration: none; }
    .badge:hover { border-color: var(--accent); color: var(--ink); }
    .footer { border-top: 1px solid var(--line); padding: 22px 20px; text-align: center; }
    .footer-links { display: flex; justify-content: center; flex-wrap: wrap; gap: 4px 16px; margin-bottom: 8px; }
    .footer-links a { font-size: 13px; color: var(--ink3); text-decoration: none; }
    .footer-links a:hover { color: var(--ink2); }
    .footer-copy { font-size: 12px; color: var(--ink3); }
  </style>
</head>
<body>

<nav class="g-nav">
  <a class="g-nav-logo" href="/">
    <div class="g-nav-icon"><svg width="18" height="18" viewBox="0 0 16 16" fill="none"><circle cx="4" cy="4" r="2" fill="white"/><circle cx="12" cy="4" r="2" fill="white"/><circle cx="4" cy="12" r="2" fill="white"/><circle cx="12" cy="12" r="2" fill="white"/><line x1="4" y1="4" x2="12" y2="4" stroke="white" stroke-width="1.5"/><line x1="4" y1="4" x2="4" y2="12" stroke="white" stroke-width="1.5"/></svg></div>
    Gridflow
  </a>
</nav>

<div class="hero">
  <h1>Täglich ein <span>Logikrätsel</span>.<br>Offline. Werbefrei.</h1>
  <p>Hashi trifft Numberlink. Verbinde Knoten, löse Puzzles, baue deinen Streak auf.</p>
  <a class="badge" href="#">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98l-.09.06c-.22.14-2.19 1.3-2.17 3.87.03 3.07 2.69 4.08 2.72 4.1l-.1.37zM13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
    Bald im App Store
  </a>
</div>

<div class="footer">
  <div class="footer-links">
    <a href="/privacy">Datenschutz</a>
    <a href="/terms">AGB</a>
    <a href="/impressum">Impressum</a>
    <a href="mailto:loopcrafts.app@gmail.com">Kontakt</a>
  </div>
  <p class="footer-copy">© 2026 Tobias Hötzel · Gridflow</p>
</div>

</body>
</html>
